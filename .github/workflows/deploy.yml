name: Deploy QAnalyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qanalyzer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_SCRIPT: |
            set -euo pipefail
            docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge
            cd /opt/QAnalyzer
            git fetch --prune origin main && git reset --hard origin/main
            git clean -fd -e .env -e '.env.*'
            docker compose up -d --build --remove-orphans
            HEALTHY=0
            for i in $(seq 1 20); do
              CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' qanalyzer-web 2>/dev/null | awk 'NF {print; exit}' || true)
              if [ -n "$CONTAINER_IP" ] && curl -sf --max-time 3 "http://${CONTAINER_IP}:8080/api/health" | grep -q '"ok"'; then
                HEALTHY=1
                echo "analyzer_health=ok (${CONTAINER_IP}:8080)"
                break
              fi
              sleep 1
            done
            docker compose ps
            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: health check qanalyzer-web gagal"
              docker logs --tail 50 qanalyzer-web || true
              exit 1
            fi
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          printf '%s\n' "$REMOTE_SCRIPT" | ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -p "$PORT" \
            "${VPS_USER}@${VPS_HOST}" 'bash -s'
