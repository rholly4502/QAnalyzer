name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore QAnalyzer.slnx

      - name: Build solution
        run: dotnet build QAnalyzer.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test QAnalyzer.slnx --no-build --configuration Release --verbosity normal

  web-build:
    name: Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Clean previous build output
        run: rm -rf src/QAnalyzer.Web/wwwroot

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify frontend build output
        run: |
          test -f src/QAnalyzer.Web/wwwroot/index.html
          test -d src/QAnalyzer.Web/wwwroot/assets
