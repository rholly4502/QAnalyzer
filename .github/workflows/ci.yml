name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore QAnalyzer.slnx

      - name: Build solution
        run: dotnet build QAnalyzer.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test QAnalyzer.slnx --no-build --configuration Release --verbosity normal

  web-build:
    name: Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Clean previous build output
        run: rm -rf src/QAnalyzer.Web/wwwroot

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify frontend build output
        run: |
          test -f src/QAnalyzer.Web/wwwroot/index.html
          test -d src/QAnalyzer.Web/wwwroot/assets

  docker-build:
    name: Docker Image Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qanalyzer-web:ci .

      - name: Smoke test container endpoints
        run: |
          set -euo pipefail
          CID=$(docker run -d -p 127.0.0.1:18080:8080 qanalyzer-web:ci)
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT

          CONTAINER_UID=$(docker exec "$CID" id -u)
          test "$CONTAINER_UID" -ne 0

          HEALTHY=0
          for i in $(seq 1 20); do
            CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$CID" 2>/dev/null | awk 'NF {print; exit}' || true)
            if [ -n "$CONTAINER_IP" ] && curl -sf --max-time 3 "http://${CONTAINER_IP}:8080/api/health" | grep -q '"ok"'; then
              HEALTHY=1
              break
            fi
            sleep 1
          done
          test "$HEALTHY" -eq 1

          curl -sf http://127.0.0.1:18080/api/health | grep -q '"ok"'

          curl -sf -X POST http://127.0.0.1:18080/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT * FROM dbo.Orders;"}' | grep -q 'SELECT_STAR'

          curl -sf -X POST http://127.0.0.1:18080/analyzer/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT * FROM dbo.Orders;"}' | grep -q 'SELECT_STAR'

          EMPTY_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"sql":""}')
          test "$EMPTY_STATUS" -eq 400

          TUNE_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/tune \
            -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT Id FROM dbo.Orders;"}')
          test "$TUNE_STATUS" -eq 503

          curl -sS -D - -o /dev/null http://127.0.0.1:18080/api/health | grep -qi '^x-content-type-options: *nosniff'

          INDEX_HTML=$(curl -sf http://127.0.0.1:18080/analyzer/)
          echo "$INDEX_HTML" | grep -q '<div id="root">'

          ASSET_PATH=$(echo "$INDEX_HTML" | grep -oE '/analyzer/assets/index-[^"]+\.js' | head -n 1)
          test -n "$ASSET_PATH"
          curl -sf "http://127.0.0.1:18080${ASSET_PATH}" >/dev/null
